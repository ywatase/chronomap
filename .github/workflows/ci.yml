name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python data contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12.10
      - name: Install project dependencies
        run: uv sync --dev
      - name: Run Python tests
        run: uv run pytest -q
      - name: Validate the Ogurike public package
        run: uv run chronomap-data validate data/ogurike --profile public

  web:
    name: Web unit, build, and browser
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Set up Python and data CLI
        run: |
          uv python install 3.12.10
          uv sync --dev
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Run web unit tests
        working-directory: web
        run: npm test -- --run
      - name: Build the static web app
        working-directory: web
        run: npm run build
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run browser acceptance tests
        working-directory: web
        run: npm run test:browser -- --reporter=line
      - name: Run browser tests against the production preview
        working-directory: web
        env:
          CHRONOMAP_PREVIEW: "1"
        run: |
          set -euo pipefail
          preview_log="$RUNNER_TEMP/chronomap-preview.log"
          npm run preview -- --host 127.0.0.1 --port 4173 > "$preview_log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then cat "$preview_log"; exit 1; fi
            sleep 1
          done
          npm run test:browser -- --reporter=line
      - name: Upload browser artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            web/test-results/
            ${{ runner.temp }}/chronomap-preview.log
          if-no-files-found: ignore
