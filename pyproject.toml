[project]
name = "chronomap-data"
version = "0.1.0"
description = "Historical data contract tooling for Chronomap"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.26,<5",
]

[project.scripts]
chronomap-data = "chronomap_data.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.1,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
