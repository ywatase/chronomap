[project]
name = "chronomap-data"
version = "0.1.0"
description = "Historical data contract tooling for Chronomap"
requires-python = ">=3.12"
dependencies = [
  "jsonschema[format-nongpl]>=4.26,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chronomap_data"]

[project.scripts]
chronomap-data = "chronomap_data.cli:main"

[dependency-groups]
dev = [
  "mapbox-vector-tile>=2.2.0",
  "pmtiles>=3.8.1",
  "pytest>=9.1,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
